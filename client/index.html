    <link rel="manifest" href="/manifest.json" />
    <script>
      // PWA scoping: on the staff/admin portal routes, swap to a portal-specific
      // manifest so installing there creates the STAFF PORTAL app (opens /staff in
      // its own window), not the public site. Runs before the app boots so the
      // browser's install prompt evaluates the right manifest. Public pages keep
      // the customer manifest untouched.
      (function () {
        try {
          var p = location.pathname;
          var link = document.querySelector('link[rel="manifest"]');
          if (!link) return;
          if (/^\/admin(\/|$)/.test(p)) link.setAttribute("href", "/manifest-admin.json");
          else if (/^\/(staff|grader)(\/|$)/.test(p)) link.setAttribute("href", "/manifest-portal.json");
        } catch (e) {
          /* leave the default manifest in place */
        }
      })();
    </script>
