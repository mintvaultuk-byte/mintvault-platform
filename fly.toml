app = "mintvault"
primary_region = "lhr"  # London — closest to your UK users

[build]

[env]
  PORT = "5000"
  NODE_ENV = "production"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  # Dedicated 2-vCPU performance tier. The scan-ingest image pipeline (sharp) is
  # CPU-bound; a shared-1x CPU throttles to baseline under sustained scanning,
  # which is what blew per-card processing out to ~13 min and backed the queue up.
  # Dedicated vCPUs do not throttle. 4gb is the performance-2x minimum and gives
  # the parallel front+back sharp buffers headroom.
  memory = "4gb"
  cpu_kind = "performance"
  cpus = 2

[deploy]
  strategy = "rolling"
  wait_timeout = "5m"
