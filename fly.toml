app = "mintvault"
primary_region = "lhr"  # London — closest to your UK users

# Wait up to 15s after SIGTERM before SIGKILL so the app's graceful shutdown
# (server/index.ts: drain in-flight requests + active cron jobs, then close the
# DB pools — 10s internal deadline) finishes cleanly on rolling deploys. Fly's
# default is ~5s, which would cut the drain short.
kill_timeout = "15s"

[build]

[env]
  PORT = "5000"
  NODE_ENV = "production"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  # Dedicated 1-vCPU performance tier. The scan-ingest image pipeline (sharp) is
  # CPU-bound; a shared-1x CPU throttles to baseline under sustained scanning,
  # which is what blew per-card processing out to ~13 min and backed the queue up.
  # Dedicated (performance) vCPUs do not throttle. Applied to BOTH machines, so
  # the two in-process scan queues run on un-throttled cores. 2gb is ample for the
  # 2000px working buffers (PR #128) — raise to 4gb only if the working res grows.
  memory = "2gb"
  cpu_kind = "performance"
  cpus = 1

[deploy]
  strategy = "rolling"
  wait_timeout = "5m"
