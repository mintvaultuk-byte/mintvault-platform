name: Scanner signed release candidate

on:
  workflow_dispatch:
    inputs:
      update_base_url:
        description: Credential-free HTTPS origin that will serve the Scanner update artifacts
        required: true
        type: string
      source_sha:
        description: Owner-approved full 40-character commit SHA on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scanner-signed-release
  cancel-in-progress: false

jobs:
  signed-arm64-release:
    name: Developer ID, notarization, stapling and Gatekeeper
    runs-on: macos-14
    if: github.ref == 'refs/heads/main' && github.sha == inputs.source_sha
    environment: scanner-release
    timeout-minutes: 60
    steps:
      - name: Assert owner-approved main commit before third-party actions
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "${APPROVED_SOURCE_SHA}"
          printf '%s' "${APPROVED_SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: scripts/scanner-app/package-lock.json
      - name: Assert protected clean Apple Silicon source
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "${APPROVED_SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Install exact Scanner dependencies
        working-directory: scripts/scanner-app
        run: npm ci --ignore-scripts
      - name: Rebuild production native dependency and run Scanner tests
        working-directory: scripts/scanner-app
        run: |
          npm rebuild sharp
          npm audit --audit-level=high
          npm test
      - name: Import isolated Developer ID identity
        env:
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.MINTVAULT_DEVELOPER_ID_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MINTVAULT_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNING_KEYCHAIN="$RUNNER_TEMP/mintvault-signing.keychain-db"
          SIGNING_KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          SIGNING_CERTIFICATE="$RUNNER_TEMP/mintvault-developer-id.p12"
          printf '%s' "$SIGNING_CERTIFICATE_P12_BASE64" | base64 --decode > "$SIGNING_CERTIFICATE"
          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$SIGNING_CERTIFICATE" -k "$SIGNING_KEYCHAIN" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN"
          printf 'SIGNING_KEYCHAIN=%s\n' "$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
      - name: Materialize App Store Connect API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.MINTVAULT_NOTARY_API_KEY_ID }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.MINTVAULT_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY"
          chmod 600 "$APPLE_API_KEY"
          printf 'APPLE_API_KEY=%s\n' "$APPLE_API_KEY" >> "$GITHUB_ENV"
      - name: Build signed, notarized and stapled release candidate
        working-directory: scripts/scanner-app
        env:
          MINTVAULT_UPDATE_BASE_URL: ${{ inputs.update_base_url }}
          MINTVAULT_APPLE_TEAM_ID: ${{ secrets.MINTVAULT_APPLE_TEAM_ID }}
          MINTVAULT_DEVELOPER_ID_APPLICATION: ${{ secrets.MINTVAULT_DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_ID: ${{ secrets.MINTVAULT_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MINTVAULT_NOTARY_API_ISSUER }}
        run: npm run package:mac:release
      - name: Remove signing credentials before artifact handoff
        if: always()
        run: |
          if test -n "${SIGNING_KEYCHAIN:-}" && test -f "$SIGNING_KEYCHAIN"; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/mintvault-developer-id.p12"
          if test -n "${APPLE_API_KEY:-}"; then
            rm -f "$APPLE_API_KEY"
          fi
      - name: Upload immutable release-candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mintvault-scanner-signed-rc-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            scripts/scanner-app/dist/MintVault-Scanner-*-arm64.dmg
            scripts/scanner-app/dist/MintVault-Scanner-*-arm64.zip
            scripts/scanner-app/dist/latest-mac.yml
            scripts/scanner-app/dist/SHA256SUMS
            scripts/scanner-app/dist/mintvault-scanner-release.json
