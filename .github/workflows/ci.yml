name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    # EXPLICIT and MINIMAL. This job previously declared no permissions block and inherited the
    # workflow/repository default, which is not a stated contract. It needs exactly two things:
    # `contents: read` to check the repo out, and `security-events: read` for the CodeQL delta gate
    # to list code-scanning alerts. Naming them removes the inherited default in both directions —
    # nothing here writes, and the delta gate no longer depends on a default someone may tighten.
    permissions:
      contents: read
      security-events: read
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/mintvault_vq_phase10_local
      MINTVAULT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/mintvault_vq_phase10_local
      # Partner Master Dashboard real-PostgreSQL suite (tests/partner-dashboard-integration.test.ts).
      # Without this the whole file is `describe.skip` and 31 tests — RLS fail-closed behaviour,
      # SQL-level risk filtering before pagination, deterministic audit ordering, consumed-credit
      # counting and repeated-scalar-parameter rejection — silently do not run. It needs its OWN
      # database because the realistic-roles helper reassigns `public` schema ownership to
      # pn_migrator, which must not happen to the shared test database.
      PARTNER_MANAGEMENT_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_rt
      # Super Admin Project Control real-PostgreSQL suites
      # (tests/project-control-migration.integration.test.ts and
      #  tests/project-control-concurrency.integration.test.ts).
      #
      # Without this the suites fell back to their local-developer default of 127.0.0.1:5432,
      # where nothing listens in CI, and 12 tests — migration 0030's table/index/constraint
      # shape, its idempotency, its rollback, the append-only audit ledger and the optimistic-
      # locking concurrency proofs — failed with ECONNREFUSED. They fail CLOSED rather than
      # skipping, which is why this surfaced as a red build instead of silent absence.
      #
      # A SEPARATE PostgreSQL 17 SERVER (port 55433), not the shared pg16 service, because:
      #   • migration 0030 is verified against PostgreSQL 17;
      #   • each suite CREATEs and DROPs its own per-PID database (pc_migration_test_<pid>,
      #     pc_concurrency_test_<pid>), so it needs CREATEDB on the admin connection;
      #   • keeping it off the shared server means it can never collide with the Vault Quest
      #     test database or with either Partner suite's database.
      #
      # The path MUST stay `/postgres`: both suites derive their disposable database URL with
      # `ADMIN_URL.replace(/\/postgres$/, '/<db>')`, so any other path would silently leave them
      # connected to the admin database.
      PROJECT_CONTROL_TEST_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:55433/postgres

      # ---- Partner User Management (PR: codex/partner-user-management) ----
      # Five DB-backed suites gate on their own admin URL and are `describe.skip` without it. Before
      # this block CI set only PARTNER_MANAGEMENT_RT_ADMIN, so the evidence for this feature —
      # migration 0031's lifecycle, migration 0032's final-owner invariant, the public onboarding
      # route mount, the whole Partner runtime, and the Partner Admin BYPASSRLS capability preflight
      # that gates every Super Admin route — reported green while never running.
      #
      # All five use the PostgreSQL 17 server (port 55433): 0031/0032 are verified against 17, and
      # the capability probe reads pg_roles.rolbypassrls on the real connection.
      #
      # Each gets its OWN database. The realistic-roles helper reassigns `public` schema ownership to
      # the non-superuser pn_migrator and applies migrations as that role, so these suites can never
      # share a database with each other, with Project Control, or with the shared test database.
      #
      # The *_RUNTIME roles are created by the suites themselves; only the URL
      # shape is supplied here. Every credential below is synthetic and local to the CI container —
      # no staging or production value belongs in this file.
      PARTNER_CAPABILITY_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_capability
      PARTNER_USER_MGMT_MIGRATION_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_user_mgmt
      PARTNER_FINAL_OWNER_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_final_owner
      PARTNER_PUBLIC_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_public
      PARTNER_PUBLIC_RT_RUNTIME: postgres://partner_app_test_public:synthetic@127.0.0.1:55433/mintvault_partner_public
      PARTNER_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_runtime
      PARTNER_RT_RUNTIME: postgres://partner_app_test_rt:synthetic@127.0.0.1:55433/mintvault_partner_runtime
      # ---- Real object-storage proof (MinIO service below) --------------------
      # DEDICATED variables only. tests/partner-real-r2-storage.test.ts deliberately reads these
      # and NEVER R2_*, so that an ambient production storage configuration cannot become the
      # target. An earlier revision of that suite resolved its endpoint from R2_ENDPOINT with
      # localhost only as a fallback, and then ran an unprefixed list -> bulk delete -> DeleteBucket
      # in beforeAll. Adding R2_* secrets to this job would have re-armed exactly that.
      #
      # These are CI-only credentials for a throwaway container on loopback. They are not secrets
      # and must never be replaced with repository secrets.
      PARTNER_REAL_R2_PROOF: "1"
      PARTNER_REAL_R2_PROOF_ENDPOINT: http://127.0.0.1:9010
      PARTNER_REAL_R2_PROOF_BUCKET: partner-real-r2-proof
      PARTNER_REAL_R2_PROOF_KEY: minioadmin
      PARTNER_REAL_R2_PROOF_SECRET: minioadmin

      # ---- Partner portal MAIN-APP mount + GLOBAL flag administration (WP-1) ----
      # tests/partner-portal-mount-integration.test.ts. Same PostgreSQL 17 server and the same
      # one-database-per-suite rule as the five above: the realistic-roles helper hands `public`
      # schema ownership to the non-superuser pn_migrator and applies the partner migrations as
      # that role, so it can never share a database with another suite.
      #
      # This suite is the ONLY coverage proving the production composition — the public routes and
      # the authenticated portal mounted into one app, in that order — keeps every fail-closed gate,
      # and the only coverage of the super-admin GLOBAL flag surface. It fails closed in CI (see the
      # "is not silently skipped in CI" guard in the file) rather than skipping, so deleting either
      # variable turns the build red instead of silently deleting the evidence.
      #
      # SHARED-VARIABLE EXCEPTION (verified, not an oversight): two other suites gate on variables
      # already listed here — tests/partner-integration-seams.test.ts on PARTNER_MOUNT_RT_* and
      # tests/partner-reset-delivery-integration.test.ts on PARTNER_PUBLIC_RT_*. That does NOT
      # violate the one-database-per-suite rule above: both read these URLs purely as a SERVER
      # COORDINATE (host/port/credentials), then rewrite `pathname` to a database name of their own
      # and CREATE it during setup. Neither ever connects to mintvault_partner_mount or
      # mintvault_partner_public, so no `public`-schema ownership reassignment can collide. Nothing
      # to add to the database-creation loop below — they provision themselves.
      PARTNER_MOUNT_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_mount
      PARTNER_MOUNT_RT_RUNTIME: postgres://partner_app_test_mount:synthetic@127.0.0.1:55433/mintvault_partner_mount

      # ---- Trusted Intake Connector production driver (WP-3) ----
      # tests/partner-connector-runtime.test.ts is `describe.skip` without these two, which would
      # make the ONLY proof that the connector is no longer runtime-inert report green while never
      # running. It drives the real sweep -> validate -> import chain against real connections, so
      # it needs a superuser admin URL (role provisioning + fixtures) and a connector-role URL.
      #
      # PostgreSQL 17 (port 55433), and its OWN database: the realistic-roles helper reassigns
      # `public` schema ownership to pn_migrator and applies the partner migrations as that role, so
      # it can never share a database with any other suite. The connector login role
      # (partner_connector_rt_test) is created by the suite itself; only the URL shape is supplied
      # here, and every credential below is synthetic and local to the CI container.
      PARTNER_CONNECTOR_RUNTIME_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_runtime
      PARTNER_CONNECTOR_RUNTIME_URL: postgres://partner_connector_rt_test:synthetic@127.0.0.1:55433/mintvault_connector_runtime

      # ---- Trusted Intake Connector — the REST of the connector evidence (WP-1.5 P3) ----
      # PARTNER_CONNECTOR_RUNTIME_* above was, until now, the ONLY connector pair CI set. Every
      # other connector suite gates on its OWN pair and is `describe.skip` without it, so ~250
      # tests — every exactly-once proof, every fault-injection/crash-recovery proof, the
      # concurrency and scale proofs, the tenant-isolation proofs, the emergency-stop and
      # flag-flip proofs and the whole G4 Super-Admin HTTP surface — reported GREEN in CI while
      # never executing a single assertion. The pairs below are what actually runs them, and the
      # "Assert connector suites executed" step after the tests turns a silent skip back into a
      # red build.
      #
      # Same rules as the Partner blocks above: PostgreSQL 17 (port 55433), ONE DATABASE PER
      # SUITE (the realistic-roles helper reassigns `public` schema ownership to the non-superuser
      # pn_migrator and applies migrations as that role, so two suites can never share a database),
      # and every credential here is synthetic and local to the CI container.
      #
      # ROLE NAMES ARE CLUSTER-WIDE, not per-database. tests/partner-connector-service.test.ts and
      # tests/partner-connector-validation-service.test.ts both used to create the SAME two login
      # roles (partner_connector_app_test / partner_app_test_conn); whichever ran second hit
      # `DROP ROLE` failing on privileges still held in the first suite's database, then `CREATE
      # ROLE` failing as a duplicate — the role-collision flake. The validation suite's two roles
      # are now uniquely named (partner_connector_val_app_test / partner_val_test_conn); every
      # other connector suite already had unique role names. Nothing about what the suites assert
      # changed. Note also that vitest.config.ts sets `fileParallelism: !TEST_DATABASE_URL`, so in
      # CI (where TEST_DATABASE_URL is set) test FILES run sequentially — the per-suite databases
      # and unique role names are what keep them from damaging each other's state across that
      # sequence.
      PARTNER_CONNECTOR_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_service
      PARTNER_CONNECTOR_RT_URL: postgres://partner_connector_app_test:synthetic@127.0.0.1:55433/mintvault_connector_service
      PARTNER_CONNECTOR_VALIDATION_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_validation
      PARTNER_CONNECTOR_VALIDATION_RT_URL: postgres://partner_connector_val_app_test:synthetic@127.0.0.1:55433/mintvault_connector_validation
      PARTNER_CONNECTOR_IMPORT_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_import
      PARTNER_CONNECTOR_IMPORT_RT_URL: postgres://partner_connector_import_test:synthetic@127.0.0.1:55433/mintvault_connector_import
      PARTNER_CONNECTOR_RECON_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_recon
      PARTNER_CONNECTOR_RECON_RT_URL: postgres://partner_connector_recon_test:synthetic@127.0.0.1:55433/mintvault_connector_recon
      PARTNER_CONNECTOR_RECON_LOAD_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_recon_load
      PARTNER_CONNECTOR_RECON_LOAD_RT_URL: postgres://partner_connector_load_test:synthetic@127.0.0.1:55433/mintvault_connector_recon_load
      PARTNER_CONNECTOR_FAULT_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_fault
      PARTNER_CONNECTOR_FAULT_RT_URL: postgres://partner_connector_fault_test:synthetic@127.0.0.1:55433/mintvault_connector_fault
      PARTNER_CONNECTOR_BLOCKER_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_blocker
      PARTNER_CONNECTOR_BLOCKER_RT_URL: postgres://partner_connector_blocker_test:synthetic@127.0.0.1:55433/mintvault_connector_blocker
      PARTNER_CONNECTOR_SCALE_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_scale
      PARTNER_CONNECTOR_SCALE_RT_URL: postgres://partner_connector_scale_test:synthetic@127.0.0.1:55433/mintvault_connector_scale
      # G4 Super-Admin connector-ops HTTP suite. Both variables point at the SAME database on
      # purpose: the suite derives its connector-runtime and partner-runtime connection URLs from
      # the second one by substituting the login roles it creates itself.
      PARTNER_CONNECTOR_ADMIN_TEST: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_ops
      PARTNER_CONNECTOR_ADMIN_TEST_RUNTIME: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_ops
      # ---- Connector suites that apply the FULL repository migration set ----
      # These five differ from the ones above: they drive listMigrationFiles(), i.e. EVERY migration
      # in migrations/, not just the partner subset. That reaches two MintVault-internal tables no
      # partner migration creates (see the "minimal precondition" step below), which is why they
      # each need it in addition to their own database.
      PARTNER_CONNECTOR_PLAN_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_plan
      PARTNER_CONNECTOR_MIGRATION_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_migration
      PARTNER_CONNECTOR_ADMIN_MIGRATION_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_admin_mig
      PARTNER_CONNECTOR_IMPORT_MIGRATION_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_import_mig
      PARTNER_CONNECTOR_VALIDATION_MIGRATION_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_connector_val_mig

      # ---- Partner RBAC: migration 0034 seed + first-owner bootstrap (this branch) ----
      # Two DB-gated suites were added with the hybrid Partner RBAC work and CI provisioned neither.
      # Both use `describe.skipIf(!isLocal)` for their real proofs, so WITHOUT these variables the
      # following evidence silently does not run:
      #   • tests/partner-rbac-migration.test.ts (PARTNER_RBAC_MIG_ADMIN) — migration 0034 driven
      #     through the REAL runner (scripts/db/migrate.ts): the catalogue reaching exactly the
      #     expected role/permission/mapping counts from the true pre-seed estate, idempotency and
      #     re-run behaviour, the journal + checksum pin, the runner's own transaction wrapping
      #     (0034 must not open its own), planMigrations() seeing 0034 pending then applied, and the
      #     read-only startup validator reporting 503-worthy BEFORE / ready AFTER while performing
      #     NO writes under a SELECT-only role.
      #   • tests/partner-rbac-bootstrap.test.ts (PARTNER_RBAC_RT_ADMIN) — the runtime regression
      #     proofs for the first-owner-invitation blocker (partner_roles empty in a deployed estate
      #     => PARTNER_ROLE_NOT_CONFIGURED, confirmed on staging 2026-07-31) plus migration 0033's
      #     audit-action precision. This is the ONLY coverage that reproduces the unseeded state
      #     instead of hand-seeding RBAC in beforeAll — the exact habit that masked the blocker.
      # Each file carries an "is not silently skipped in CI" guard that fails the build when the
      # variable is absent under CI/GITHUB_ACTIONS, so deleting either turns the build red rather
      # than silently deleting the evidence.
      #
      # PostgreSQL 17 (port 55433, the existing service): the bootstrap suite asserts
      # server_version_num >= 170000 in beforeAll, and 0033/0034 are verified against 17.
      #
      # ONE DATABASE PER SUITE, same rule as every Partner block above: both suites call
      # provisionRealisticRoles() / applyMigrationsRealistic() from tests/helpers/partner-realistic-db.ts,
      # which reassigns `public` schema ownership to the non-superuser pn_migrator and applies the
      # migrations as that role — and both DROP and recreate schema `public` wholesale between tests.
      # They can therefore never share a database with each other or with any other suite.
      #
      # NOT added to the "full repository migration set" loop below: neither applies
      # listMigrationFiles() wholesale. The bootstrap suite applies only
      # PARTNER_MIGRATIONS_WITH_AUDIT_PRECISION, and the migration suite calls listMigrationFiles()
      # solely to `.filter()` down to 0034_partner_rbac_seed.sql before handing that single file to
      # applyMigrations(). Neither 0018 (indexes audit_log) nor 0022 (ALTERs certificates) is ever
      # executed, so the audit_log/certificates stub pair is not a precondition here.
      #
      # ROLE NAMES ARE CLUSTER-WIDE: the only extra login role either suite creates is
      # mv_rbac_reader (the migration suite's SELECT-only validator role), which no other test file
      # in tests/ creates — verified — so it cannot repeat the connector role-collision flake. The
      # shared pn_migrator / partner_definer / partner_runtime roles come from the idempotent
      # helper, exactly as in the existing partner suites. Every credential here is synthetic and
      # local to the CI container.
      PARTNER_RBAC_MIG_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_rbac_mig
      PARTNER_RBAC_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_rbac_rt

      # ---- Partner Management UX v1 runtime proofs ----
      # tests/partner-management-ux-runtime.test.ts landed with psp/partner-management-ux-v1 carrying
      # an "is not silently skipped in CI" guard, but the variable it gates on was never added here.
      # That guard fails closed, so it did not silently delete the evidence — it turned the build RED:
      # run 30604205792 on main (add695f2) failed with exactly one assertion,
      #   "PARTNER_UX_RT_ADMIN must be a disposable loopback PostgreSQL 17 URL in CI"
      #   -> 1 failed | 238 passed.
      # Same class of omission as the RBAC pair above, one merge earlier. With the variable set the
      # suite runs 23/23 and its 22 real proofs (partner/location/user lifecycle over the UX v1
      # surface, and migration 0033's partner_legal_name_changed audit action) execute instead of
      # reddening the build.
      #
      # PostgreSQL 17 (port 55433) and its OWN database, same one-database-per-suite rule as every
      # Partner block above: it calls provisionRealisticRoles() / applyMigrationsRealistic(), which
      # hand `public` schema ownership to the non-superuser pn_migrator.
      PARTNER_UX_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_ux_rt

      # ---- Partner RLS TENANT ISOLATION — the single most important proof in the partner stack ----
      # tests/partner-rls-isolation.test.ts gates the WHOLE file on PARTNER_RLS_DB via
      # `(isLocal ? describe : describe.skip)`. This variable appeared ZERO times in this workflow,
      # so the file has been `describe.skip` in CI since it was written: every tenant-isolation
      # assertion in the partner stack reported green while never executing. It also had no
      # "is not silently skipped in CI" guard, so nothing made that visible. Both are now fixed —
      # the file carries the guard, and "Assert partner RLS suite executed" below asserts EXECUTION
      # so hard-skipping the gate cannot delete the evidence either.
      #
      # WHY THE ROLE SHAPE MATTERS. On staging the partner RUNTIME role is partner_app_staging with
      # rolbypassrls = FALSE, while the ADMIN role is neondb_owner with rolbypassrls = TRUE
      # (verified read-only against staging, 2026-07-31). RLS therefore genuinely binds in
      # production shape. The suite mirrors that: it connects as the superuser admin to apply
      # migrations and seed fixtures, then runs EVERY attack under `SET ROLE partner_runtime` —
      # the NOLOGIN/NOSUPERUSER/NOBYPASSRLS role that migration 0001 creates. It does not need a
      # separate *_RUNTIME login URL, because SET ROLE changes the effective user that Postgres
      # evaluates RLS and BYPASSRLS against, and every partner table is FORCE ROW LEVEL SECURITY so
      # table ownership grants no exemption either. The suite's first assertion proves the role is
      # genuinely restricted (current_user = partner_runtime, rolbypassrls false, is_superuser off,
      # row_security on), so it can never silently degrade into a superuser no-op; the precondition
      # below catches the same misconfiguration one step earlier, at setup.
      #
      # PostgreSQL 17 (port 55433) and its OWN database, same one-database-per-suite rule as every
      # Partner block above: the suite runs `DROP OWNED BY partner_runtime`, applies the partner
      # migration chain, and TRUNCATEs the whole partner estate in beforeAll, so it can never share
      # a database with another suite. Unlike the blocks above it does NOT use the realistic-roles
      # helper — it applies the migrations as the superuser and attacks through SET ROLE — so no
      # `public`-schema ownership reassignment is involved.
      #
      # SCOPE NOTE: the suite applies 0001 + 0007 + 0016 + 0017, i.e. the chain that creates the
      # tables the pilot ACTUALLY uses (partner_customers, partner_submissions,
      # partner_submission_cards, partner_submission_events, partner_wallets, partner_credit_ledger,
      # partner_credit_reservations, partner_credit_reservation_events). It previously applied 0001
      # alone, which covers only the org/user/session layer — so even had it run, the pilot's real
      # data surface had zero tenant-isolation coverage.
      PARTNER_RLS_DB: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_rls

      # ---- Partner auth P0 proofs (mandatory first-owner MFA + lockout recovery + MFA hardening) ----
      # Each suite gates the WHOLE file on its *_RT_ADMIN/_RUNTIME pair being a loopback URL and
      # carries an in-file "is not silently skipped in CI" guard, so an unset var REDDENS CI rather
      # than passing green. Each creates its OWN uniquely named login role from the admin
      # connection, so the admin URL must carry CREATEROLE (asserted in the prepare step below).
      # ---- Partner certificate origin (migration 0035) ----
      # Package B ships tests/partner-certificate-origin.test.ts, which gates the whole file on
      # this variable and carries a fail-loud in-CI guard. B touched no CI file, so the D+E ci.yml
      # union audit could not have noticed the gap — without this the branch reddens CI.
      PARTNER_CERT_ORIGIN_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_cert_origin
      # ---- Super Admin control shell (tests/partner-admin-control-shell-integration.test.ts) ----
      # FOURTH suite of the same class, found by an independent Matrix A/B assurance run rather than
      # by CI: the file gates on PARTNER_ADMIN_TEST / PARTNER_ADMIN_TEST_RUNTIME, and NEITHER name
      # has ever appeared in this workflow. The similarly-spelled PARTNER_CONNECTOR_ADMIN_TEST pair
      # below belongs to a different suite, which is what made the omission easy to miss. Result:
      # 11 tests — requireAdmin rejection, partner/location/user suspend, session revoke, the
      # feature-flag write path, emergency stop, MFA reset, read-endpoint authorisation and the
      # suspend concurrency proof — reported as a passing FILE while executing nothing, with no
      # in-file guard and no execution floor to notice. Both are added alongside this.
      #
      # PostgreSQL 17 and its OWN database, same one-database-per-suite rule as every Partner block
      # above: it calls applyMigrationsRealistic(), which hands `public` schema ownership to the
      # non-superuser pn_migrator. It creates its own login role (partner_app_test_shell), so the
      # admin connection needs CREATEROLE — asserted in the prepare step below.
      PARTNER_ADMIN_TEST: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_admin_shell
      PARTNER_ADMIN_TEST_RUNTIME: postgres://partner_app_test_shell:synthetic@127.0.0.1:55433/mintvault_partner_admin_shell
      # Three suites that shipped with a self-gate but were never wired here, so they reported
      # `describe.skip` and the build stayed green on 48 tests that never ran. Wired 2026-08-03.
      PARTNER_DEFINER_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_definer
      PARTNER_MANAGEMENT_MIGRATION_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_mgmt_mig
      PARTNER_GRADING_BRIDGE_MIGRATION_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_bridge_mig
      # The 0047/0048 security repairs. Its own PostgreSQL 17 database, because it rolls the two
      # repairs back and re-applies them mid-suite to reproduce the pre-fix vulnerabilities — a
      # shared database would leave every other suite briefly running against an un-forced RLS
      # table and an un-pinned trigger function.
      PARTNER_SECURITY_REPAIRS_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_sec_repairs
      # The correction-mode suite refuses any database whose name is not the throwaway it expects.
      CORRECTION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55433/mintvault_correction_test
      #
      # ROLE NAMES MUST MATCH THE SUITES. Each of these suites DROPs and CREATEs its OWN uniquely
      # named login role (partner_app_test_mfa_enrol / _lockout / _mfa_hard) and grants it
      # partner_runtime. They stopped using the shared `partner_app_test` name deliberately — roles
      # are CLUSTER-wide, so the shared name was the documented connector-flake class. Pointing a
      # _RUNTIME URL back at `partner_app_test` would silently reintroduce it from the other side:
      # the pool would connect as a role THIS suite never creates or grants, and would only work if
      # some other suite happened to have created it first on the same cluster. A security proof must
      # not depend on which file vitest scheduled first.
      PARTNER_MFA_ENROL_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_mfa_enrol
      PARTNER_MFA_ENROL_RT_RUNTIME: postgres://partner_app_test_mfa_enrol:synthetic@127.0.0.1:55433/mintvault_partner_mfa_enrol
      PARTNER_MFA_BF_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_mfa_bf
      PARTNER_MFA_BF_RT_RUNTIME: postgres://partner_app_test_mfa_bf:synthetic@127.0.0.1:55433/mintvault_partner_mfa_bf
      PARTNER_LOCKOUT_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_lockout
      PARTNER_LOCKOUT_RT_RUNTIME: postgres://partner_app_test_lockout:synthetic@127.0.0.1:55433/mintvault_partner_lockout
      # ---- Partner MFA current-factor hardening (recovery regeneration / disable / replacement) ----
      # tests/partner-mfa-factor-hardening.test.ts gates the whole file on this pair being loopback
      # and carries the same fail-loud in-CI guard, so an unset var REDDENS CI rather than passing.
      PARTNER_MFA_HARDENING_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_mfa_hardening
      PARTNER_MFA_HARDENING_RT_RUNTIME: postgres://partner_app_test_mfa_hard:synthetic@127.0.0.1:55433/mintvault_partner_mfa_hardening
      # ---- Partner lockout DECAY (a spent lockout must not re-arm from one probe) ----
      # Its own database and its own login role, so it cannot collide with the lockout-recovery
      # suite it sits beside. Same fail-loud in-CI guard as its peers.
      PARTNER_LOCKOUT_DECAY_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55433/mintvault_partner_lockout_decay
      PARTNER_LOCKOUT_DECAY_RT_RUNTIME: postgres://partner_app_test_lockdecay:synthetic@127.0.0.1:55433/mintvault_partner_lockout_decay
    services:
      postgres:
        # pgvector-enabled Postgres 16 (official pgvector image, same server as
        # postgres:16 + the `vector` extension available). shared/schema.ts
        # declares a `vector(1536)` embedding column (RAG pipeline), so the plain
        # postgres:16 image failed `drizzle-kit push` at DB setup with
        # `type "vector" does not exist`. The extension is still CREATEd below.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mintvault_vq_phase10_local
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d mintvault_vq_phase10_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Dedicated PostgreSQL 17 for the Project Control suites (see
      # PROJECT_CONTROL_TEST_ADMIN_URL above). Deliberately a different SERVER and a different
      # port from the pg16 service, so the suites' CREATE/DROP DATABASE cycle is isolated from
      # the shared test database and from both Partner databases.
      postgres17:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the grading-release-scope guard (tests/helpers/grading-release-scope.ts)
          # can reach its pinned base commits (d69ad147/fc57b53b); it fail-closes on a shallow clone.
          # Mirrors the gitleaks job, which already uses fetch-depth: 0.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # S3-compatible object storage for the real Partner storage proof.
      #
      # A step rather than a `services:` entry, for two concrete reasons:
      #  1. minio/minio needs `server /data`, and Actions service containers cannot supply a
      #     command. bitnami/minio used to start it via its own entrypoint, but that image was
      #     retired and no longer resolves — wiring it as a service would fail on image pull.
      #  2. A step lets the bucket be created and asserted before any test runs.
      #
      # Bound to loopback 9010, which is what the suite's endpoint allow-list accepts. Throwaway
      # container, CI-only credentials, holding nothing but this run's ci-proof/ prefix.
      - name: Start MinIO (real storage proof)
        run: |
          set -euo pipefail
          docker run -d --name mv-ci-minio -p 9010:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9010/minio/health/live >/dev/null 2>&1; then
              echo "MinIO healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "MinIO never became healthy"; docker logs --tail 50 mv-ci-minio; exit 1

      - run: npm ci

      # MUST stay after `npm ci`: the script imports @aws-sdk/client-s3, so running it before the
      # install fails with ERR_MODULE_NOT_FOUND. That is not hypothetical — this step sat above the
      # install on the first attempt and CI failed exactly that way. It passed locally only because
      # node_modules already existed there, which is precisely the kind of "green on my machine"
      # difference CI is supposed to catch. Do not move it back above the install.
      - name: Create the storage proof bucket
        run: node scripts/ci/ensure-proof-bucket.mjs

      - name: Prepare disposable test database
        run: |
          node - <<'NODE'
          const testUrl = new URL(process.env.TEST_DATABASE_URL || "");
          const appUrl = new URL(process.env.MINTVAULT_DATABASE_URL || "");
          const safe =
            testUrl.hostname === "127.0.0.1" &&
            testUrl.port === "55432" &&
            testUrl.pathname === "/mintvault_vq_phase10_local" &&
            process.env.TEST_DATABASE_URL === process.env.MINTVAULT_DATABASE_URL;
          if (!safe) {
            throw new Error("CI database URLs must point to the disposable local Vault Quest test database");
          }
          console.log(`[ci-db] disposable database host=${testUrl.hostname}:${testUrl.port} db=${testUrl.pathname.slice(1)}`);
          // Project Control admin URL — same loopback discipline. It is an ADMIN connection that
          // creates and drops databases, so it is checked explicitly rather than trusted. The
          // `/postgres` path is load-bearing: both suites build their disposable database URL by
          // replacing that exact suffix.
          const pcUrl = new URL(process.env.PROJECT_CONTROL_TEST_ADMIN_URL || "");
          const pcSafe =
            pcUrl.hostname === "127.0.0.1" && pcUrl.port === "55433" && pcUrl.pathname === "/postgres";
          if (!pcSafe) {
            throw new Error("PROJECT_CONTROL_TEST_ADMIN_URL must be the disposable loopback PostgreSQL 17 admin URL");
          }
          console.log(`[ci-db] project-control admin host=${pcUrl.hostname}:${pcUrl.port} db=${pcUrl.pathname.slice(1)}`);
          NODE
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          # pgvector must exist before drizzle-kit push, which creates the
          # shared/schema.ts `vector(1536)` embedding column. Idempotent; the
          # pgvector/pgvector image ships the extension files.
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
          npx drizzle-kit push --force
          for migration in migrations-vq/*.sql; do
            echo "[ci-db] applying ${migration}"
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "SELECT pg_get_constraintdef(oid) FROM pg_constraint WHERE conname = 'vq_feature_flags_feature_check'" | grep -q "gen_action_pose"
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "SELECT pg_get_constraintdef(oid) FROM pg_constraint WHERE conname = 'vq_feature_flags_feature_check'" | grep -q "auto_paid_retry"
          # Project Control server must be reachable AND be PostgreSQL 17, and the admin role
          # must be able to CREATE DATABASE — otherwise the suites would fail deep inside
          # beforeAll with a less obvious message.
          psql "$PROJECT_CONTROL_TEST_ADMIN_URL" -v ON_ERROR_STOP=1 -tAc "SELECT version()"
          pc_major="$(psql "$PROJECT_CONTROL_TEST_ADMIN_URL" -v ON_ERROR_STOP=1 -tAc "SHOW server_version_num")"
          if [ "$pc_major" -lt 170000 ]; then
            echo "Project Control tests require PostgreSQL 17, got server_version_num=$pc_major" >&2
            exit 1
          fi
          psql "$PROJECT_CONTROL_TEST_ADMIN_URL" -v ON_ERROR_STOP=1 -tAc "SELECT rolcreatedb FROM pg_roles WHERE rolname = current_user" | grep -q "t"
          # One database per Partner User Management suite on the same PostgreSQL 17 server.
          # Same idempotent pattern as mintvault_partner_rt above: CREATE DATABASE has no
          # IF NOT EXISTS, and \gexec is a psql meta-command that is not parsed under -c, so
          # existence is queried first via command substitution (whose exit status propagates
          # under set -e, rather than being swallowed by a pipe).
          for partner_db in mintvault_partner_rt \
                            mintvault_partner_capability mintvault_partner_user_mgmt \
                            mintvault_partner_final_owner mintvault_partner_public \
                            mintvault_partner_runtime mintvault_partner_mount \
                            mintvault_connector_runtime \
                            mintvault_connector_service mintvault_connector_validation \
                            mintvault_connector_import mintvault_connector_recon \
                            mintvault_connector_recon_load mintvault_connector_fault \
                            mintvault_connector_blocker mintvault_connector_scale \
                            mintvault_connector_ops mintvault_connector_plan \
                            mintvault_connector_migration mintvault_connector_admin_mig \
                            mintvault_connector_import_mig mintvault_connector_val_mig \
                            mintvault_partner_rbac_mig mintvault_partner_rbac_rt \
                            mintvault_partner_ux_rt mintvault_partner_rls mintvault_partner_cert_origin \
                            mintvault_partner_definer mintvault_partner_mgmt_mig \
                            mintvault_partner_admin_shell \
                            mintvault_partner_bridge_mig \
                            mintvault_partner_sec_repairs \
                            mintvault_correction_test; do
            present="$(psql "$PROJECT_CONTROL_TEST_ADMIN_URL" -v ON_ERROR_STOP=1 -tAc \
              "SELECT 1 FROM pg_database WHERE datname = '$partner_db'")"
            if [ "$present" != "1" ]; then
              psql "$PROJECT_CONTROL_TEST_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $partner_db"
            fi
            echo "[ci-db] partner suite database ready: $partner_db"
          done
          # The capability suite creates and ALTERs roles (BYPASSRLS / NOBYPASSRLS), so the admin
          # role must carry CREATEROLE — otherwise its two route-gating tests would fail deep
          # inside beforeAll instead of reporting a clear precondition failure here.
          psql "$PARTNER_CAPABILITY_RT_ADMIN" -v ON_ERROR_STOP=1 -tAc \
            "SELECT rolcreaterole OR rolsuper FROM pg_roles WHERE rolname = current_user" | grep -q "t"
          # The connector-driver suite creates its own login role and drives the cross-tenant
          # discovery sweep, which only returns rows for a BYPASSRLS connection (the handoff table is
          # FORCE RLS). Assert both here so a misconfiguration fails loudly at setup instead of
          # producing a silently-empty sweep — or a silently-skipped suite — deep inside the run.
          psql "$PARTNER_CONNECTOR_RUNTIME_ADMIN" -v ON_ERROR_STOP=1 -tAc \
            "SELECT rolcreaterole OR rolsuper FROM pg_roles WHERE rolname = current_user" | grep -q "t"
          psql "$PARTNER_CONNECTOR_RUNTIME_ADMIN" -v ON_ERROR_STOP=1 -tAc \
            "SELECT rolbypassrls OR rolsuper FROM pg_roles WHERE rolname = current_user" | grep -q "t"
          # Every other connector suite creates login roles and drives the connector pool under the
          # same conditions, so assert CREATEROLE + BYPASSRLS on each of their admin connections
          # too. A misconfiguration then fails loudly HERE instead of as a silently-empty sweep or
          # an obscure beforeAll error deep inside the run.
          for connector_admin in "$PARTNER_CONNECTOR_RT_ADMIN" "$PARTNER_CONNECTOR_VALIDATION_RT_ADMIN" \
                                 "$PARTNER_CONNECTOR_IMPORT_RT_ADMIN" "$PARTNER_CONNECTOR_RECON_RT_ADMIN" \
                                 "$PARTNER_CONNECTOR_RECON_LOAD_RT_ADMIN" "$PARTNER_CONNECTOR_FAULT_RT_ADMIN" \
                                 "$PARTNER_CONNECTOR_BLOCKER_RT_ADMIN" "$PARTNER_CONNECTOR_SCALE_RT_ADMIN" \
                                 "$PARTNER_CONNECTOR_ADMIN_TEST"; do
            psql "$connector_admin" -v ON_ERROR_STOP=1 -tAc \
              "SELECT rolcreaterole OR rolsuper FROM pg_roles WHERE rolname = current_user" | grep -q "t"
            psql "$connector_admin" -v ON_ERROR_STOP=1 -tAc \
              "SELECT rolbypassrls OR rolsuper FROM pg_roles WHERE rolname = current_user" | grep -q "t"
          done
          # Both Partner RBAC suites provision the realistic role model (pn_migrator /
          # partner_definer / partner_runtime) and the migration suite additionally CREATEs and
          # DROPs its own SELECT-only mv_rbac_reader login role, so their admin connections must
          # carry CREATEROLE. Assert it here so a misconfiguration fails loudly at setup instead of
          # deep inside beforeAll. The bootstrap suite also asserts PostgreSQL 17 itself, which is
          # already guaranteed by the pg17 service check above.
          # The control-shell suite CREATEs and DROPs its own partner_app_test_shell login role.
          psql "$PARTNER_ADMIN_TEST" -v ON_ERROR_STOP=1 -tAc \
            "SELECT rolcreaterole OR rolsuper FROM pg_roles WHERE rolname = current_user" | grep -q "t"
          for rbac_admin in "$PARTNER_RBAC_MIG_ADMIN" "$PARTNER_RBAC_RT_ADMIN"; do
            psql "$rbac_admin" -v ON_ERROR_STOP=1 -tAc \
              "SELECT rolcreaterole OR rolsuper FROM pg_roles WHERE rolname = current_user" | grep -q "t"
          done
          # Partner RLS tenant-isolation preconditions. This suite's entire value depends on the
          # role it attacks under being genuinely restricted, so both halves are asserted HERE
          # rather than discovered as a silently-passing no-op deep inside the run:
          #   1. the admin connection must be superuser/CREATEROLE — it applies the partner
          #      migration chain (which CREATEs partner_runtime) and seeds fixtures under BYPASSRLS;
          #   2. IF partner_runtime already exists in this cluster, it MUST be NOBYPASSRLS. Role
          #      names are cluster-wide, so another suite's helper creating it with BYPASSRLS would
          #      leave every "tenant A cannot see tenant B" assertion passing vacuously while
          #      proving nothing. Migration 0001 creates it NOLOGIN (hence NOBYPASSRLS by default)
          #      and does not ALTER an existing role, so this is the only place that can catch it.
          #      This mirrors staging, where the runtime role partner_app_staging has
          #      rolbypassrls = FALSE and only the admin role neondb_owner has it TRUE.
          psql "$PARTNER_RLS_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT rolsuper OR rolcreaterole FROM pg_roles WHERE rolname = current_user" | grep -q "t"
          rls_bypass="$(psql "$PARTNER_RLS_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT coalesce((SELECT rolbypassrls FROM pg_roles WHERE rolname = 'partner_runtime'), false)")"
          if [ "$rls_bypass" != "f" ]; then
            echo "partner_runtime must be NOBYPASSRLS for tests/partner-rls-isolation.test.ts to prove anything (got rolbypassrls=$rls_bypass)" >&2
            exit 1
          fi
          echo "[ci-db] partner RLS role model ok: partner_runtime is NOBYPASSRLS (or not yet created)"

          # Partner auth P0 proof databases (mandatory MFA enrolment + lockout recovery).
          # Same idempotent pattern as the partner_db loop above, and for the same reason: \gexec is
          # a psql META-command and is NOT parsed under -c, so the previous form sent the literal
          # backslash to the server and died with `syntax error at or near "\"` before any test ran.
          # Existence is queried first via command substitution, whose exit status propagates under
          # set -e instead of being swallowed by a pipe.
          for auth_db in mintvault_partner_mfa_enrol mintvault_partner_lockout mintvault_partner_mfa_hardening mintvault_partner_lockout_decay mintvault_partner_mfa_bf; do
            present="$(psql "$PROJECT_CONTROL_TEST_ADMIN_URL" -v ON_ERROR_STOP=1 -tAc \
              "SELECT 1 FROM pg_database WHERE datname = '$auth_db'")"
            if [ "$present" != "1" ]; then
              psql "$PROJECT_CONTROL_TEST_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $auth_db"
            fi
            echo "[ci-db] partner auth suite database ready: $auth_db"
          done
          for auth_admin in "$PARTNER_MFA_ENROL_RT_ADMIN" "$PARTNER_LOCKOUT_RT_ADMIN" "$PARTNER_MFA_HARDENING_RT_ADMIN" "$PARTNER_LOCKOUT_DECAY_RT_ADMIN" "$PARTNER_MFA_BF_RT_ADMIN"; do
            psql "$auth_admin" -v ON_ERROR_STOP=1 -tAc \
              "SELECT rolcreaterole OR rolsuper FROM pg_roles WHERE rolname = current_user" | grep -q "t"
          done
          # MINIMAL precondition for the five suites that apply the FULL repository migration set
          # via listMigrationFiles() rather than just the partner subset:
          #   • 0018_correction_audit_index.sql builds a partial index ON audit_log;
          #   • 0022_print_workflow_lifecycle.sql runs ALTER TABLE certificates (its data-backfill
          #     half is already guarded on the real grade columns, so a stub table is exactly what
          #     it expects — see the comment in that migration).
          # No partner migration creates either table, and the suites do not seed them, so without
          # this every one of them dies in beforeAll with `relation "audit_log" does not exist`.
          #
          # DELIBERATELY NOT a full `drizzle-kit push` / real schema / pgvector. That was tried and
          # is actively WRONG here: the real shared/schema.ts `certificates` has no `secret` column,
          # so a full push breaks the pre-existing-data fixtures these suites build (they insert
          # cert_id/secret and assert the row survives rollback), and shared/schema.ts also declares
          # a vector(1536) column the postgres:17 service cannot create. The minimal stub pair is
          # both sufficient and the only correct option.
          #
          # Both tables must be OWNED BY pn_migrator, because the migrations are applied as that
          # non-superuser role and would otherwise hit "must be owner of table". pn_migrator is
          # created here with the same name and password tests/helpers/partner-realistic-db.ts
          # uses, and that helper's own CREATE ROLE is idempotent, so the two cannot conflict.
          # PARTNER_MANAGEMENT_MIGRATION_ADMIN is the SIXTH full-set applier — it also runs
          # listMigrationFiles() in full, so it needs the same audit_log/certificates stub pair.
          # Delegated to a script that imports tests/helpers/partner-realistic-db.ts, so the stub
          # schema has exactly ONE definition shared with the suites.
          #
          # This replaced an inline `certificates (id serial, cert_id text, secret text)`. Migration
          # 0049 references further certificates columns, so all six full-set appliers began dying
          # in beforeAll — and a failed beforeAll makes vitest report the file as SKIPPED, so it
          # read as configuration rather than breakage. The execution-floor assertions caught it.
          #
          # NOTE: 0049 no longer references certificates.submission_id. That column does not exist
          # on any real deployment; the original fix (make the stub supply it) was the wrong
          # direction and is recorded in scripts/ci/ensure-stub-base-tables.mts.
          #
          # Keeping the stub hand-written here guaranteed a repeat: any future migration touching
          # certificates would break CI until someone remembered the YAML copy. Now it does not.
          npx tsx scripts/ci/ensure-stub-base-tables.mts \
            PARTNER_CONNECTOR_PLAN_ADMIN \
            PARTNER_CONNECTOR_MIGRATION_ADMIN \
            PARTNER_CONNECTOR_ADMIN_MIGRATION_ADMIN \
            PARTNER_CONNECTOR_IMPORT_MIGRATION_ADMIN \
            PARTNER_CONNECTOR_VALIDATION_MIGRATION_ADMIN \
            PARTNER_MANAGEMENT_MIGRATION_ADMIN \
            PARTNER_GRADING_BRIDGE_MIGRATION_ADMIN \
            PARTNER_SECURITY_REPAIRS_ADMIN

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      # Same run as `npm test` (which is `vitest run`), with a machine-readable report added so the
      # next step can prove the connector suites actually EXECUTED rather than silently skipped.
      # The report is written even when tests fail, so the assertion below still reports which
      # suites ran.
      - name: Test
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=vitest-report.json

      # A skipped suite and a passing suite look identical in an exit code. This step fails the
      # build if any expected connector suite is missing from the report or executed 0 tests —
      # which is exactly how ~250 connector tests reported green for months without running.
      # `if: always()` so a genuine test failure does not hide a suite that never ran at all.
      - name: Assert connector suites executed
        if: always()
        run: node scripts/ci/assert-connector-suites-executed.mjs vitest-report.json

      - name: Assert partner management suite executed
        if: always()
        run: node scripts/ci/assert-partner-management-suite-executed.mjs vitest-report.json

      # The four suites carrying the pilot's end-to-end evidence had NO execution floor: they were
      # in no manifest at all, so a gate edit or one missing env var reported them as passed with
      # zero tests run. Same class of hole that let ~250 connector tests report green without
      # running.
      - name: Assert partner pilot suites executed
        if: always()
        run: node scripts/ci/assert-partner-pilot-suites-executed.mjs vitest-report.json

      # The two RBAC suites' own "is not silently skipped in CI" guards only catch a MISSING
      # environment variable. They cannot catch `describe.skipIf(!isLocal)` being edited to
      # `describe.skip`, which leaves the variables set, reports the file as passed and keeps the
      # build green with every real proof gone (verified: 6 passed | 15 skipped, exit 0). This step
      # asserts EXECUTION instead of configuration, exactly as the connector assertion above does.
      - name: Assert partner RBAC suites executed
        if: always()
        run: node scripts/ci/assert-partner-rbac-suites-executed.mjs vitest-report.json

      # The tenant boundary is the one thing in the partner stack that must never regress silently.
      # This step asserts tests/partner-rls-isolation.test.ts actually EXECUTED its isolation
      # assertions — present in the report, above its floor, and ZERO skipped. Configuration alone
      # is not enough: with PARTNER_RLS_DB correctly set, editing the file's gate to `describe.skip`
      # would report the file as passed and keep the build green with every cross-tenant proof gone.
      - name: Assert partner RLS suite executed
        if: always()
        run: node scripts/ci/assert-partner-rls-suite-executed.mjs vitest-report.json

      - name: Assert partner auth P0 suites executed
        if: always()
        run: node scripts/ci/assert-partner-auth-suites-executed.mjs vitest-report.json

      # CodeQL DELTA GATE — blocks what this branch INTRODUCES, grandfathers what it inherited.
      #
      # It lives in THIS job on purpose. `Lint, Type Check, Test & Build` is already a required
      # context in main's branch protection, so putting the gate here makes a new HIGH/CRITICAL
      # block a merge with NO branch-protection change at all — the narrowest possible mechanism.
      #
      # It closes a real gap rather than adding ceremony. The required CodeQL context is
      # `CodeQL (SAST) (javascript-typescript)`, which proves the ANALYSIS RAN and says nothing
      # about what it found; the separate aggregate `CodeQL` check looks at findings but flags any
      # alert in touched code, so on a large PR it reports long-standing repository debt as new.
      # Neither enforced the actual policy. This does.
      #
      # `if: always()` so a red test run cannot hide a newly introduced vulnerability, and the step
      # is NOT continue-on-error: a new HIGH fails the build.
      #
      # Needs `security-events: read`, declared explicitly on this job (it previously had no
      # permissions block and relied on an inherited default). On a fork PR the token cannot read
      # code scanning; the script reports that distinctly as `analysis_did_not_run` and fails
      # rather than passing on an empty list.
      - name: Assert no NEW CodeQL HIGH/CRITICAL (delta vs baselined main debt)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            node scripts/ci/assert-codeql-delta.mjs --pr "${{ github.event.pull_request.number }}"
          else
            node scripts/ci/assert-codeql-delta.mjs --ref "refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Build
        run: npm run build

      - name: Audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true

  # ── Security scanning (forward-ported from security/remediation-release) ──
  # Additive to the check job above; these run independently and surface SAST /
  # secret / dependency findings on every push + PR to main. They do NOT gate the
  # Fly deploy (deploys are manual) — they are a signal, not a blocker.
  dependency-review:
    name: PR dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Dependency review (block HIGH on the PR diff)
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits on the ref
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # CodeQL uploads its SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore:
              - tests/**
              - scripts/cricut-app/**
              - server/scripts/**
              - dist/**
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  # ── linux/amd64 production-image release proof ────────────────────────────────
  # WHY THIS JOB EXISTS. The Dockerfile pins both stages to node:20.20.2-slim
  # because file-type@22 is ESM-only and the server bundles to CJS, so booting
  # needs Node's require(esm) (>=20.19). That pin had no build-or-boot proof.
  #
  # It cannot be proven on an ARM dev machine: building linux/amd64 there needs
  # QEMU, and esbuild (Go) reliably SIGSEGVs under user-mode emulation —
  # "unexpected fault address / fatal error: fault" inside
  # esbuild/internal/js_parser during the vite client build. That is an emulation
  # defect, not a code or dependency fault (npm ci completed cleanly first).
  #
  # ubuntu-latest IS native amd64, so here the build is real rather than emulated.
  # This job never pushes, never deploys, and uses no production secrets.
  amd64-release-proof:
    name: linux/amd64 image build & boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amd64probe
        ports: ["55440:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build the production image (native amd64, no emulation)
        run: |
          set -euo pipefail
          docker build --build-arg GIT_SHA="$(git rev-parse --short HEAD)" -t mv-amd64-proof:ci .

      - name: Image really is linux/amd64 and carries the pinned Node
        run: |
          set -euo pipefail
          arch="$(docker image inspect mv-amd64-proof:ci --format '{{.Architecture}}')"
          os="$(docker image inspect mv-amd64-proof:ci --format '{{.Os}}')"
          echo "image: $os/$arch"
          [ "$arch" = "amd64" ] && [ "$os" = "linux" ] || { echo "not linux/amd64"; exit 1; }
          # Do not trust image metadata alone — ask the running container.
          uname_m="$(docker run --rm --entrypoint sh mv-amd64-proof:ci -c 'uname -m')"
          node_v="$(docker run --rm --entrypoint node mv-amd64-proof:ci -p 'process.versions.node')"
          node_arch="$(docker run --rm --entrypoint node mv-amd64-proof:ci -p 'process.arch')"
          echo "uname=$uname_m node=$node_v arch=$node_arch"
          [ "$uname_m" = "x86_64" ] || { echo "container is not x86_64"; exit 1; }
          [ "$node_arch" = "x64" ] || { echo "node arch is not x64"; exit 1; }
          [ "$node_v" = "20.20.2" ] || { echo "expected Node 20.20.2, got $node_v"; exit 1; }

      - name: Native and ESM dependencies load under Node 20.20.2
        run: |
          set -euo pipefail
          # file-type is the ESM-only dependency the >=20.19 floor exists for: this is
          # require(esm) actually working inside the shipped image, not a version check.
          docker run --rm --entrypoint node mv-amd64-proof:ci -e '
            const { fileTypeFromBuffer } = require("file-type");
            const sharp = require("sharp");
            const { createCanvas } = require("canvas");
            const PDFDocument = require("pdfkit");
            (async () => {
              const png = Buffer.from("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==", "base64");
              const t = await fileTypeFromBuffer(png);
              if (!t || t.mime !== "image/png") throw new Error("magic-byte validation failed: " + JSON.stringify(t));
              const meta = await sharp(png).metadata();
              if (meta.format !== "png") throw new Error("sharp did not decode png");
              const c = createCanvas(80, 40); const ctx = c.getContext("2d");
              ctx.fillStyle = "#D4AF37"; ctx.fillRect(0, 0, 80, 40);
              const bytes = c.toBuffer("image/png");
              if (!bytes || bytes.length < 100) throw new Error("canvas rendered no bytes");
              const doc = new PDFDocument(); doc.text("amd64 proof"); doc.end();
              console.log("OK file-type=" + t.mime + " sharp=" + meta.format + " canvas=" + bytes.length + "B pdfkit=loaded");
            })().catch((e) => { console.error(e); process.exit(1); });
          '

      - name: Readiness fails CLOSED before the schema exists
        run: |
          set -euo pipefail
          docker run -d --name mv-amd64-boot --network host \
            -e NODE_ENV=production -e PORT=5055 \
            -e MINTVAULT_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:55440/amd64probe" \
            -e SESSION_SECRET=amd64-proof-not-a-real-secret \
            -e SIGNED_URL_SECRET=amd64-proof-not-a-real-secret \
            -e ADMIN_PASSWORD=amd64-proof -e ADMIN_PIN=000000 \
            mv-amd64-proof:ci
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:5055/health >/dev/null 2>&1 && break
            sleep 2
          done
          echo "--- /health ---"; curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:5055/health
          curl -fsS http://127.0.0.1:5055/health | grep -q '"status":"ok"'
          echo "--- /ready with NO certificates table (must be 503) ---"
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5055/ready)"
          echo "ready=$code"
          [ "$code" = "503" ] || { echo "readiness did not fail closed"; docker logs mv-amd64-boot | tail -40; exit 1; }

      - name: Readiness succeeds once the schema is present; version reports this SHA
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD=postgres mv-amd64-boot true 2>/dev/null || true
          # Create the one relation /ready probes for, in the disposable database.
          docker run --rm --network host -e PGPASSWORD=postgres postgres:17.10 \
            psql -h 127.0.0.1 -p 55440 -U postgres -d amd64probe \
            -c "CREATE TABLE IF NOT EXISTS certificates (id serial primary key)"
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5055/ready)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "ready=$code"; [ "$code" = "200" ] || { docker logs mv-amd64-boot | tail -40; exit 1; }
          echo "--- /api/version must report the built SHA ---"
          expected="$(git rev-parse --short HEAD)"
          body="$(curl -fsS http://127.0.0.1:5055/api/version)"; echo "$body"
          echo "$body" | grep -q "$expected" || { echo "expected commit $expected"; exit 1; }
          echo "--- Partner router mounted (401/403/503, never 404) ---"
          pcode="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5055/api/partner/me)"
          echo "partner/me=$pcode"
          [ "$pcode" != "404" ] || { echo "Partner router is NOT mounted"; exit 1; }

      - name: Clean SIGTERM shutdown
        run: |
          set -euo pipefail
          docker stop --time 30 mv-amd64-boot >/dev/null
          code="$(docker inspect mv-amd64-boot --format '{{.State.ExitCode}}')"
          echo "exit code after SIGTERM: $code"
          [ "$code" = "0" ] || [ "$code" = "143" ] || { docker logs mv-amd64-boot | tail -40; exit 1; }

      - name: Tear down
        if: always()
        run: docker rm -f mv-amd64-boot >/dev/null 2>&1 || true
