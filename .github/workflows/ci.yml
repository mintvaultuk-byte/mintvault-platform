name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/mintvault_vq_phase10_local
      MINTVAULT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/mintvault_vq_phase10_local
      # Partner Master Dashboard real-PostgreSQL suite (tests/partner-dashboard-integration.test.ts).
      # Without this the whole file is `describe.skip` and 31 tests — RLS fail-closed behaviour,
      # SQL-level risk filtering before pagination, deterministic audit ordering, consumed-credit
      # counting and repeated-scalar-parameter rejection — silently do not run. It needs its OWN
      # database because the realistic-roles helper reassigns `public` schema ownership to
      # pn_migrator, which must not happen to the shared test database.
      PARTNER_MANAGEMENT_RT_ADMIN: postgres://postgres:postgres@127.0.0.1:55432/mintvault_partner_rt
    services:
      postgres:
        # pgvector-enabled Postgres 16 (official pgvector image, same server as
        # postgres:16 + the `vector` extension available). shared/schema.ts
        # declares a `vector(1536)` embedding column (RAG pipeline), so the plain
        # postgres:16 image failed `drizzle-kit push` at DB setup with
        # `type "vector" does not exist`. The extension is still CREATEd below.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mintvault_vq_phase10_local
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d mintvault_vq_phase10_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the grading-release-scope guard (tests/helpers/grading-release-scope.ts)
          # can reach its pinned base commits (d69ad147/fc57b53b); it fail-closes on a shallow clone.
          # Mirrors the gitleaks job, which already uses fetch-depth: 0.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prepare disposable test database
        run: |
          node - <<'NODE'
          const testUrl = new URL(process.env.TEST_DATABASE_URL || "");
          const appUrl = new URL(process.env.MINTVAULT_DATABASE_URL || "");
          const safe =
            testUrl.hostname === "127.0.0.1" &&
            testUrl.port === "55432" &&
            testUrl.pathname === "/mintvault_vq_phase10_local" &&
            process.env.TEST_DATABASE_URL === process.env.MINTVAULT_DATABASE_URL;
          if (!safe) {
            throw new Error("CI database URLs must point to the disposable local Vault Quest test database");
          }
          console.log(`[ci-db] disposable database host=${testUrl.hostname}:${testUrl.port} db=${testUrl.pathname.slice(1)}`);
          NODE
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          # pgvector must exist before drizzle-kit push, which creates the
          # shared/schema.ts `vector(1536)` embedding column. Idempotent; the
          # pgvector/pgvector image ships the extension files.
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
          # Dedicated database for the Partner PostgreSQL suites (Partner Master Dashboard and
          # Partner Management). Separate from the shared test DB because those suites hand
          # `public` schema ownership to a non-superuser migrator role and apply the partner
          # migrations as that role.
          #
          # `\gexec` is a psql META-COMMAND and is NOT parsed when passed via `-c`: the previous
          # form failed with `syntax error at or near "\"` and never created the database.
          # CREATE DATABASE also has no IF NOT EXISTS, so existence is queried first and the
          # create is issued only when needed — idempotent on a re-run.
          #
          # No pipes, no grep/sed: the query result is captured by command substitution, whose
          # exit status IS the assignment's exit status, so an unreachable server or bad
          # credentials aborts the step under `set -e` instead of being silently swallowed.
          partner_db_present="$(psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM pg_database WHERE datname = 'mintvault_partner_rt'")"
          if [ "$partner_db_present" != "1" ]; then
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE mintvault_partner_rt"
          fi
          npx drizzle-kit push --force
          for migration in migrations-vq/*.sql; do
            echo "[ci-db] applying ${migration}"
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "SELECT pg_get_constraintdef(oid) FROM pg_constraint WHERE conname = 'vq_feature_flags_feature_check'" | grep -q "gen_action_pose"
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "SELECT pg_get_constraintdef(oid) FROM pg_constraint WHERE conname = 'vq_feature_flags_feature_check'" | grep -q "auto_paid_retry"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true

  # ── Security scanning (forward-ported from security/remediation-release) ──
  # Additive to the check job above; these run independently and surface SAST /
  # secret / dependency findings on every push + PR to main. They do NOT gate the
  # Fly deploy (deploys are manual) — they are a signal, not a blocker.
  dependency-review:
    name: PR dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Dependency review (block HIGH on the PR diff)
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits on the ref
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # CodeQL uploads its SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore:
              - tests/**
              - scripts/cricut-app/**
              - server/scripts/**
              - dist/**
      - name: Analyze
        uses: github/codeql-action/analyze@v3
