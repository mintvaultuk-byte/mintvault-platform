<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MintVault Scanner Guide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Drag handle: a thin strip across the top so the operator can move the
       window. -webkit-app-region:drag is set in CSS. The close-toggle would
       go here too if we ever wanted minimise; skipped for now. -->
  <header class="drag-strip" id="dragStrip">
    <span class="title">MintVault Scanner</span>
    <span class="header-right">
      <span class="updated" id="updated"></span>
      <button class="hide-btn" id="hideBtn" title="Hide window (re-show via menu bar or dock click)" aria-label="Hide window">×</button>
    </span>
  </header>

  <main id="panel" class="panel state-loading">
    <!-- Renderer fills this dynamically. Initial content is the "loading"
         placeholder so the first paint isn't blank. -->
    <div class="big-icon" id="icon">⏳</div>
    <div class="big-text" id="bigText">Loading…</div>
    <div class="subtext" id="subtext">Waiting for watcher state file</div>
    <div class="meta" id="meta"></div>
    <div class="buttons" id="buttons"></div>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- Manual Mode modal — hidden by default; .visible toggles display. -->
  <div class="modal-backdrop" id="manualModal" role="dialog" aria-modal="true" aria-labelledby="manualTitle">
    <div class="modal">
      <div class="modal-header">
        <span id="manualTitle">Manual mode — attach scan</span>
        <button class="modal-close" id="manualClose" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span class="field-label">Cert ID</span>
          <input type="text" id="manualCert" placeholder="MV57" autocapitalize="characters" autocomplete="off" spellcheck="false" />
        </label>
        <div class="preview" id="manualPreview"></div>
        <div class="field-row">
          <span class="field-label">Side</span>
          <label class="radio"><input type="radio" name="manualSide" value="front" /><span>Front</span></label>
          <label class="radio"><input type="radio" name="manualSide" value="back" checked /><span>Back</span></label>
        </div>
        <label class="checkbox" id="manualReplaceWrap">
          <input type="checkbox" id="manualReplace" />
          <span>Replace existing image (overwrites the file currently on this side)</span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="manualCancel">Cancel</button>
        <button class="btn-primary" id="manualSubmit" disabled>Wait for next scan</button>
      </div>
    </div>
  </div>

  <script src="poll.js"></script>
</body>
</html>
