app = "mintvault-v2"
primary_region = "lhr"

# Match prod: wait up to 15s after SIGTERM before SIGKILL so the app's graceful
# shutdown (drain requests + active cron jobs, then close DB pools) completes.
kill_timeout = "15s"

[build]

[env]
  PORT = "5000"
  NODE_ENV = "production"
  VAULT_VERSION = "v2"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/healthz"
    timeout = "5s"

[[vm]]
  # Match prod (fly.toml) — dedicated 1-vCPU performance tier so the staging
  # scan-test timing is representative of prod (a shared-1x CPU throttles under
  # sustained scanning and would understate the post-PR-#128 speedup). 2gb is
  # ample for the 2000px working buffers.
  memory = "2gb"
  cpu_kind = "performance"
  cpus = 1
